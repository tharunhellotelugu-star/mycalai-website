<style>
  :root{
    --paper:#FEF7FF;
    --surface:#FFFFFF;
    --ink:#1D1B20;
    --ink-soft:#625B71;
    --violet:#6750A4;
    --violet-deep:#21005D;
    --violet-container:#EADDFF;
    --coral:#F97316;
    --coral-light:#FFEDD5;
    --line:#E3DAF0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:28px;
    max-width:440px;
    width:100%;
    padding:48px 36px;
    text-align:center;
    box-shadow:0 20px 60px -20px rgba(33,0,93,0.25);
  }
  .badge{
    width:76px;
    height:76px;
    margin:0 auto 24px;
    border-radius:50%;
    background:var(--violet-container);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .badge svg{width:38px;height:38px;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:26px;
    color:var(--violet-deep);
    margin-bottom:12px;
    letter-spacing:-0.01em;
  }
  p{
    color:var(--ink-soft);
    font-size:15px;
    line-height:1.6;
    margin-bottom:32px;
  }
  .btn{
    display:inline-block;
    background:var(--violet);
    color:#fff;
    font-weight:600;
    font-size:15px;
    text-decoration:none;
    padding:14px 32px;
    border-radius:100px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 24px -8px rgba(103,80,164,0.5);
  }
  .foot{
    margin-top:28px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .foot a{color:var(--violet);text-decoration:none;font-weight:600;}
</style>
</head>

  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 13l4 4L19 7" stroke="#6750A4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Your email is verified</h1>
    <p>You're all set — switch back to the MyCal AI app and sign in to start scanning meals, tracking progress, and getting coached.</p>

    <div class="foot">You can close this tab and return to the app.</div>
  </div>
</body>
